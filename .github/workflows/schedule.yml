name: Liverpool Channel Auto Poster

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies and fonts
        run: |
          sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
          pip install feedparser requests google-genai beautifulsoup4 Pillow

      - name: Run News Bot (Bot 1)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python bot.py

      - name: Run Matchday & Player Radar Bot (Bot 2)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python stats_bot.py

      - name: Save posted links history
        run: |
          git config --global user.name "LFC Bot"
          git config --global user.email "bot@noreply.github.com"
          git add posted_links.json post_queue.json stats_history.json || true
          git diff --staged --quiet || git commit -m "Update bots history and queue"
          git push
